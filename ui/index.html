<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메이플헬퍼</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="body">
    <!-- ─────────── 좌측 리스트 ─────────── -->
    <aside class="list">
      <div class="list-head">
        <svg viewBox="0 0 100 100" width="16" height="16">
          <g transform="translate(50,44) scale(0.86)" fill="#e8622c">
            <path d="M0 -44 C11 -25 13 -8 0 8 C-13 -8 -11 -25 0 -44 Z"/>
            <path transform="rotate(58)" d="M0 -44 C11 -25 13 -8 0 8 C-13 -8 -11 -25 0 -44 Z"/>
            <path transform="rotate(-58)" d="M0 -44 C11 -25 13 -8 0 8 C-13 -8 -11 -25 0 -44 Z"/>
            <path transform="rotate(118) scale(0.72)" d="M0 -44 C11 -25 13 -8 0 8 C-13 -8 -11 -25 0 -44 Z"/>
            <path transform="rotate(-118) scale(0.72)" d="M0 -44 C11 -25 13 -8 0 8 C-13 -8 -11 -25 0 -44 Z"/>
            <circle r="11" cy="-4"/>
            <path d="M-3.2 0 L3.2 0 L2 32 L-2 32 Z"/>
          </g>
        </svg>
        <span>메이플헬퍼</span>
      </div>
      <div class="list-scroll" id="item-list"></div>
      <div class="list-foot">
        <button id="btn-add-preset" class="btn tiny">+ 프리셋</button>
        <button id="btn-settings" class="btn tiny" title="설정">⚙</button>
      </div>
    </aside>

    <!-- ─────────── 우측 상세 ─────────── -->
    <section class="detail">
      <div id="update-banner" class="update-banner hidden">
        <span id="update-text">새 버전 사용 가능</span>
        <button id="update-btn" class="btn tiny">지금 업데이트</button>
      </div>
      <header class="detail-head">
        <div class="detail-title-wrap">
          <input type="text" id="detail-title" readonly value="현재 값" />
          <p id="detail-sub" class="sub">-</p>
        </div>
        <label class="switch" title="필터키 켜기/끄기 (레지스트리: Flags)">
          <input type="checkbox" id="power-toggle" />
          <span class="slider-sw"></span>
        </label>
      </header>

      <!-- 값 편집 뷰 -->
      <div id="view-values">
        <div class="vrow" title="키를 누르고 나서 실제 입력으로 먹히기까지 눌러야 하는 시간 · 크면 짧게 누른 키가 씹힘 · 메이플 세팅은 0 권장 · 최대 20초 (윈도우 한계) · '같은 키 연타 무시 시간'과 동시 사용 불가">
          <div class="lbl"><label>키가 먹히기까지 시간</label><span class="regname">DelayBeforeAcceptance</span></div>
          <input type="range" id="sl-wait" min="0" max="20000" step="5" />
          <div class="num-wrap"><input type="number" id="in-wait" min="0" max="20000" /><span class="unit-suffix">ms</span></div>
        </div>
        <div class="vrow" title="키를 꾹 누르고 있을 때 연타(자동 반복 입력)가 시작되기까지 기다리는 시간 · 낮을수록 연타가 빨리 시작됨 · 초보 150 / 고수 100 · 최대 20초 (윈도우 한계)">
          <div class="lbl"><label>연타 시작까지 대기시간</label><span class="regname">AutoRepeatDelay</span></div>
          <input type="range" id="sl-delay" min="0" max="20000" step="5" />
          <div class="num-wrap"><input type="number" id="in-delay" min="0" max="20000" /><span class="unit-suffix">ms</span></div>
        </div>
        <div class="vrow" title="연타가 시작된 후 연타 한 번과 다음 연타 사이의 간격 · 낮을수록 연타 속도가 빨라짐 · 초보 20 / 고수 10 · 0이면 연타 자체가 꺼짐 · 최대 20초 (윈도우 한계)">
          <div class="lbl"><label>연타 속도 (한 번 간격)</label><span class="regname">AutoRepeatRate</span></div>
          <input type="range" id="sl-repeat" min="0" max="20000" step="5" />
          <div class="num-wrap"><input type="number" id="in-repeat" min="0" max="20000" /><span class="unit-suffix">ms</span></div>
        </div>
        <div class="vrow" title="키를 뗐다가 다시 누를 때, 이 시간 안에 다시 누른 입력은 무시됨 · 빠른 연타가 씹히는 주범 · 0 권장 · 최대 20초 (윈도우 한계) · '키가 먹히기까지 시간'과 동시 사용 불가">
          <div class="lbl"><label>같은 키 연타 무시 시간</label><span class="regname">BounceTime</span></div>
          <input type="range" id="sl-bounce" min="0" max="20000" step="5" />
          <div class="num-wrap"><input type="number" id="in-bounce" min="0" max="20000" /><span class="unit-suffix">ms</span></div>
        </div>
        <div class="vrow" id="hotkey-row" title="이 프리셋을 즉시 적용하는 전역 단축키 · 게임 중에도 동작">
          <label>단축키</label>
          <div class="row-right">
            <button class="hotkey-chip" id="preset-hotkey-btn">지정 안 됨</button>
          </div>
        </div>
      </div>

      <!-- 설정 뷰 -->
      <div id="view-settings" class="hidden">
        <div class="vrow" title="누를 때마다 필터키를 켜고 끕니다 · 켤 때는 마지막 활성 프리셋 값으로 켜집니다">
          <label>ON/OFF 토글 단축키</label>
          <div class="row-right">
            <button class="hotkey-chip" id="toggle-hotkey-btn">지정 안 됨</button>
            <button class="btn tiny" id="toggle-hotkey-clear" title="해제">✕</button>
          </div>
        </div>
        <div class="vrow" title="값 표시 단위">
          <label>표시 단위</label>
          <div class="row-right">
            <div class="unit-toggle">
              <button id="unit-ms" class="unit-btn">ms</button>
              <button id="unit-s" class="unit-btn">초</button>
            </div>
          </div>
        </div>
        <div class="vrow" title="켜면 적용값이 레지스트리에 기록되어 재부팅 후에도 유지 · 끄면 이번 세션만">
          <div class="lbl"><label>레지스트리 영구 저장</label><span class="regname">HKCU\..\Accessibility\Keyboard Response</span></div>
          <div class="row-right">
            <label class="switch small"><input type="checkbox" id="opt-persist" /><span class="slider-sw"></span></label>
          </div>
        </div>
        <div class="vrow" title="단축키 동작 시 비프음 · 켜짐=높은음 / 꺼짐=낮은음 / 프리셋=중간음">
          <label>단축키 동작음</label>
          <div class="row-right">
            <label class="switch small"><input type="checkbox" id="opt-beep" /><span class="slider-sw"></span></label>
          </div>
        </div>
      </div>

      <footer class="detail-foot">
        <span class="foot-info" title="시스템에 실제 적용되어 있는 값">시스템 <b id="sys-summary">-</b></span>
        <div class="foot-btns">
          <button id="btn-delete" class="btn">삭제</button>
          <button id="btn-save" class="btn">저장</button>
          <button id="btn-apply" class="btn primary">적용</button>
        </div>
      </footer>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="hotkey-overlay" class="overlay hidden">
    <div class="overlay-box">
      <h3>단축키 입력 대기 중…</h3>
      <p>원하는 키 조합을 누르세요 (예: <code>Ctrl + Alt + F9</code>)</p>
      <p class="muted-line">Esc: 취소 · Backspace: 해제</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
